<svg viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Marker pour les flèches -->
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#2c3e50" />
    </marker>
  </defs>
  
  <!-- Background blanc -->
  <rect width="1600" height="600" fill="#ffffff"/>
  
  <!-- Titre manuscrit -->
  <text x="800" y="40" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    Pipeline RAG - Système de Question-Réponse
  </text>
  <line x1="400" y1="50" x2="1200" y2="50" stroke="#2c3e50" stroke-width="1.5"/>
  
  <!-- Box 1: Documents -->
  <rect x="50" y="120" width="220" height="140" rx="3" fill="none" stroke="#34495e" stroke-width="2.5"/>
  <text x="160" y="150" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    1. DOCUMENTS
  </text>
  <line x1="70" y1="160" x2="250" y2="160" stroke="#34495e" stroke-width="1"/>
  <text x="160" y="185" font-family="'Courier New', monospace" font-size="13" fill="#34495e" text-anchor="middle">
   fichiers PDF
  </text>

  <!-- Flèche 1->2 -->
  <line x1="270" y1="190" x2="330" y2="190" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="300" y="180" font-family="'Courier New', monospace" font-size="11" fill="#7f8c8d" text-anchor="middle">
    chargement
  </text>
  
  <!-- Box 2: Chunking -->
  <rect x="330" y="120" width="220" height="140" rx="3" fill="none" stroke="#34495e" stroke-width="2.5"/>
  <text x="440" y="150" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    2. DÉCOUPAGE
  </text>
  <line x1="350" y1="160" x2="530" y2="160" stroke="#34495e" stroke-width="1"/>
  <text x="440" y="185" font-family="'Courier New', monospace" font-size="13" fill="#34495e" text-anchor="middle">
    246 chunks
  </text>
  <text x="440" y="210" font-family="'Courier New', monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">
    taille: 800 chars
  </text>
  <text x="440" y="230" font-family="'Courier New', monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">
    overlap: 150
  </text>
  
  <!-- Flèche 2->3 -->
  <line x1="550" y1="190" x2="610" y2="190" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="580" y="180" font-family="'Courier New', monospace" font-size="11" fill="#7f8c8d" text-anchor="middle">
    split
  </text>
  
  <!-- Box 3: Embeddings -->
  <rect x="610" y="120" width="220" height="140" rx="3" fill="none" stroke="#34495e" stroke-width="2.5"/>
  <text x="720" y="150" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    3. EMBEDDINGS
  </text>
  <line x1="630" y1="160" x2="810" y2="160" stroke="#34495e" stroke-width="1"/>
  <text x="720" y="185" font-family="'Courier New', monospace" font-size="13" fill="#34495e" text-anchor="middle">
    Vectorisation
  </text>
  <text x="720" y="210" font-family="'Courier New', monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">
    MPNet (768D)
  </text>
  <text x="720" y="230" font-family="'Courier New', monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">
    multilingue
  </text>
  
  <!-- Flèche 3->4 -->
  <line x1="830" y1="190" x2="890" y2="190" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="860" y="180" font-family="'Courier New', monospace" font-size="11" fill="#7f8c8d" text-anchor="middle">
    encode
  </text>
  
  <!-- Box 4: FAISS -->
  <rect x="890" y="120" width="220" height="140" rx="3" fill="none" stroke="#34495e" stroke-width="2.5"/>
  <text x="1000" y="150" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    4. BASE FAISS
  </text>
  <line x1="910" y1="160" x2="1090" y2="160" stroke="#34495e" stroke-width="1"/>
  <text x="1000" y="185" font-family="'Courier New', monospace" font-size="13" fill="#34495e" text-anchor="middle">
    Index vectoriel
  </text>
  <text x="1000" y="210" font-family="'Courier New', monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">
    246 vecteurs
  </text>
  <text x="1000" y="230" font-family="'Courier New', monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">
    similarité cosinus
  </text>
  
  <!-- Flèche verticale vers le bas -->
  <line x1="1000" y1="260" x2="1000" y2="320" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="1020" y="290" font-family="'Courier New', monospace" font-size="11" fill="#7f8c8d">
    attente
  </text>
  
  <!-- Box Query -->
  <rect x="890" y="320" width="220" height="100" rx="3" fill="#ecf0f1" stroke="#e67e22" stroke-width="3"/>
  <text x="1000" y="350" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#d35400" text-anchor="middle">
    QUESTION
  </text>
  <line x1="910" y1="360" x2="1090" y2="360" stroke="#e67e22" stroke-width="1"/>
  <text x="1000" y="385" font-family="'Courier New', monospace" font-size="11" fill="#7f8c8d" text-anchor="middle" font-style="italic">
    "Différence SUM/SUMX ?"
  </text>
  <text x="1000" y="405" font-family="'Courier New', monospace" font-size="10" fill="#95a5a6" text-anchor="middle">
    (utilisateur)
  </text>
  
  <!-- Flèche Query vers Retrieval -->
  <line x1="890" y1="370" x2="830" y2="370" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="860" y="360" font-family="'Courier New', monospace" font-size="11" fill="#7f8c8d" text-anchor="middle">
    recherche
  </text>
  
  <!-- Box 5: Retrieval -->
  <rect x="610" y="320" width="220" height="100" rx="3" fill="none" stroke="#34495e" stroke-width="2.5"/>
  <text x="720" y="350" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    5. RETRIEVAL
  </text>
  <line x1="630" y1="360" x2="810" y2="360" stroke="#34495e" stroke-width="1"/>
  <text x="720" y="385" font-family="'Courier New', monospace" font-size="13" fill="#34495e" text-anchor="middle">
    Top-5 documents
  </text>
  <text x="720" y="405" font-family="'Courier New', monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">
    pertinents
  </text>
  
  <!-- Flèche Retrieval vers LLM -->
  <line x1="610" y1="370" x2="550" y2="370" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="580" y="360" font-family="'Courier New', monospace" font-size="11" fill="#7f8c8d" text-anchor="middle">
    contexte
  </text>
  
  <!-- Box 6: LLM -->
  <rect x="330" y="320" width="220" height="100" rx="3" fill="none" stroke="#34495e" stroke-width="2.5"/>
  <text x="440" y="350" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    6. LLM (Phi-2)
  </text>
  <line x1="350" y1="360" x2="530" y2="360" stroke="#34495e" stroke-width="1"/>
  <text x="440" y="385" font-family="'Courier New', monospace" font-size="13" fill="#34495e" text-anchor="middle">
    Génération
  </text>
  <text x="440" y="405" font-family="'Courier New', monospace" font-size="12" fill="#7f8c8d" text-anchor="middle">
    2.7B paramètres
  </text>
  
  <!-- Flèche LLM vers Response -->
  <line x1="330" y1="370" x2="270" y2="370" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="300" y="360" font-family="'Courier New', monospace" font-size="11" fill="#7f8c8d" text-anchor="middle">
    réponse
  </text>
  
  <!-- Box 7: Response -->
  <rect x="50" y="320" width="220" height="100" rx="3" fill="#d5f4e6" stroke="#27ae60" stroke-width="3"/>
  <text x="160" y="350" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#1e8449" text-anchor="middle">
    7. RÉPONSE
  </text>
  <line x1="70" y1="360" x2="250" y2="360" stroke="#27ae60" stroke-width="1"/>
  <text x="160" y="385" font-family="'Courier New', monospace" font-size="13" fill="#27ae60" text-anchor="middle">
    Avec sources
  </text>
  <text x="160" y="405" font-family="'Courier New', monospace" font-size="12" fill="#52be80" text-anchor="middle">
    (PDF + pages)
  </text>

</svg>